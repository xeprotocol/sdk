name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The crypto is pure JS so it runs anywhere, but the SDK is meant to
        # work on the Node version people actually have as well as the current
        # one. Test both rather than assume.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run examples:check

  browser:
    # The same crypto has to work in a browser: the SDK is for programs that
    # hold their own keys, and plenty of those run in a page.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run test/unit --browser.enabled --browser.headless --browser.name=chromium --browser.provider=playwright

  integration:
    # Against the live testnet. Allowed to fail the job without failing the
    # build: the network is a shared, wipeable testnet and an outage there is
    # not a defect in this repository.
    runs-on: ubuntu-latest
    continue-on-error: true
    # One leasing wallet is shared by every run; two runs at once would race its
    # chain and reject each other's blocks. Queue them rather than cancel.
    concurrency:
      group: testnet-leasing-wallet
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          XE_NODE: https://ldn.core.test.network
          XE_FAUCET: https://faucet.test.network
      # Every tutorial's complete program, run for real. Leasing needs XCU and
      # is skipped unless a funded seed is configured.
      # Leases go only to provider p1 (26740934…c06b), one of the testnet's own
      # providers: anyone can register a provider, and one that never accepts
      # would fail the run.
      - run: npm run examples:live
        env:
          XE_NODE: https://ldn.core.test.network
          XE_FAUCET: https://faucet.test.network
          XE_LEASE_SEED: ${{ secrets.XE_LEASE_SEED }}
          XE_PROVIDERS: 26740934b57627b340fd881710fbca3ab70f662e18a20fd21d4773aa6c56c06b
